<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbia — Lernen mit Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#f5f0e8;font-family:'Cormorant Garamond',serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(200,169,110,0.15)}
.logo{font-family:'DM Mono',monospace;font-size:1rem;letter-spacing:0.3em;color:#f5f0e8;text-decoration:none}
.logo span{color:#c8a96e}
.tag{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;color:#555;text-transform:uppercase}
main{flex:1;max-width:700px;width:100%;margin:0 auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
#chat{flex:1;display:flex;flex-direction:column;gap:1rem;min-height:300px}
.msg{display:flex;gap:0.8rem;animation:fu 0.3s ease forwards;opacity:0}
.msg.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:0.6rem;flex-shrink:0;margin-top:4px}
.av.lola{background:#2e5c4a;color:#c8a96e;border:1px solid rgba(200,169,110,0.3)}
.av.user{background:rgba(200,169,110,0.15);color:#c8a96e}
.bub{max-width:85%;padding:0.9rem 1.2rem;font-size:1rem;line-height:1.75;font-weight:300}
.bub.lola{background:rgba(26,58,42,0.4);border:1px solid rgba(200,169,110,0.1);color:#f0ebe0;border-radius:0 8px 8px 8px}
.bub.user{background:rgba(200,169,110,0.1);border:1px solid rgba(200,169,110,0.2);color:#e8d5a3;border-radius:8px 0 8px 8px;text-align:right}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c8a96e;animation:b 1.2s infinite;margin:0 2px;opacity:0.6}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
.qr{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem}
.qb{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;padding:0.4rem 0.9rem;background:transparent;border:1px solid rgba(200,169,110,0.25);color:#c8a96e;cursor:pointer;border-radius:2px;text-transform:uppercase;transition:all 0.2s}
.qb:hover{background:rgba(200,169,110,0.1)}
.inp{border-top:1px solid rgba(200,169,110,0.1);padding-top:1rem;display:flex;gap:0.8rem;align-items:flex-end}
textarea{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(200,169,110,0.2);border-radius:4px;padding:0.8rem 1rem;color:#f5f0e8;font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:300;resize:none;outline:none;min-height:48px;max-height:120px;line-height:1.5}
textarea:focus{border-color:rgba(200,169,110,0.5)}
button#sb{width:48px;height:48px;background:#c8a96e;border:none;border-radius:4px;color:#0e0e0e;cursor:pointer;font-size:1.1rem;flex-shrink:0}
button#sb:disabled{opacity:0.4;cursor:not-allowed}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo"><span>O</span>RBIA</a>
  <span class="tag">Unique Language Learning Loop</span>
</header>
<main>
  <div id="chat"></div>
  <div class="qr" id="qr"></div>
  <div class="inp">
    <textarea id="ti" placeholder="Schreiben Sie hier..." rows="1"></textarea>
    <button id="sb" onclick="send()">→</button>
  </div>
</main>
<script>
const API='https://eloquent-pony-7b5217.netlify.app/.netlify/functions/chat';
const SYSTEM=`Du bist Lola, die persönliche Sprachlernberaterin von Orbia. Warm, professionell, direkt. Sie siezen immer. Kurze Sätze. Immer nur EINE Frage. Führe eine Bedarfsanalyse durch: Name, Muttersprache, Zielsprache, Niveau, Ziel, Zeitrahmen. Metasprachliche Erklärungen immer in der Muttersprache des Schülers.`;

let history=[];

async function callLola(messages){
  const r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system:SYSTEM,messages:messages,maxTokens:500})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  return d.content[0].text;
}

function addMsg(role,text){
  const chat=document.getElementById('chat');
  const m=document.createElement('div');
  m.className='msg '+role;
  m.innerHTML=`<div class="av ${role}">${role==='lola'?'LO':'SIE'}</div><div class="bub ${role}">${text.replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(m);
  chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
  const chat=document.getElementById('chat');
  const m=document.createElement('div');
  m.className='msg lola';m.id='typ';
  m.innerHTML=`<div class="av lola">LO</div><div class="bub lola typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;
}

function hideTyping(){const t=document.getElementById('typ');if(t)t.remove();}

function setQR(opts){
  const qr=document.getElementById('qr');
  qr.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='qb';b.textContent=o;
    b.onclick=()=>{document.getElementById('ti').value=o;send();};
    qr.appendChild(b);
  });
}

async function send(){
  const ti=document.getElementById('ti');
  const sb=document.getElementById('sb');
  const msg=ti.value.trim();
  if(!msg)return;
  ti.value='';
  ti.style.height='auto';
  document.getElementById('qr').innerHTML='';
  addMsg('user',msg);
  sb.disabled=true;
  showTyping();
  history.push({role:'user',content:msg});
  try{
    const reply=await callLola(history);
    history.push({role:'assistant',content:reply});
    hideTyping();
    addMsg('lola',reply);
    const low=reply.toLowerCase();
    if(low.includes('niveau')||low.includes('kenntnisse')){
      setQR(['Kompletter Anfänger','Grundkenntnisse','Mittelstufe','Fortgeschritten']);
    } else if(low.includes('ziel')||low.includes('wozu')){
      setQR(['Urlaub','Business-Meetings','Auswandern','Präsentationen']);
    } else if(low.includes('wann')||low.includes('zeitrahmen')){
      setQR(['1 Monat','3 Monate','6 Monate','Kein Zeitdruck']);
    } else if(low.includes('sprache')||low.includes('lernen')){
      setQR(['Spanisch','Deutsch','Englisch','Italienisch']);
    }
  } catch(e){
    hideTyping();
    addMsg('lola','Fehler: '+e.message);
  }
  sb.disabled=false;
  ti.focus();
}

document.getElementById('ti').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
document.getElementById('ti').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

(async()=>{
  showTyping();
  try{
    const greeting=await callLola([{role:'user',content:'Begrüße mich herzlich auf Deutsch und stelle dich vor. Stelle dann die erste Frage.'}]);
    history.push({role:'assistant',content:greeting});
    hideTyping();
    addMsg('lola',greeting);
    setQR(['Spanisch lernen','Deutsch lernen','Englisch lernen']);
  } catch(e){
    hideTyping();
    addMsg('lola','Fehler beim Start: '+e.message);
  }
})();
</script>
</body>
</html>
