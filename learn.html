<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbia — Lernen mit Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0e0e;
    --paper: #f5f0e8;
    --gold: #c8a96e;
    --gold-light: #e8d5a3;
    --muted: #8a8070;
    --accent: #1a3a2a;
    --lola: #2e5c4a;
    --lola-light: #e8f0ec;
    --danger: #c0392b;
    --success: #27ae60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: #0e0e0e;
    color: #f5f0e8;
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(200,169,110,0.15);
    background: #0a0a0a;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.3em;
    color: #f5f0e8;
    text-decoration: none;
  }

  .logo span { color: var(--gold); }

  .header-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    padding: 2rem;
  }

  /* PHASE INDICATOR */
  .phase-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(200,169,110,0.1);
  }

  .phase-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(200,169,110,0.2);
    transition: all 0.4s ease;
  }

  .phase-dot.active {
    background: var(--gold);
    box-shadow: 0 0 8px rgba(200,169,110,0.5);
  }

  .phase-dot.done {
    background: var(--success);
  }

  .phase-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-left: 0.5rem;
  }

  .phase-label span {
    color: var(--gold);
  }

  /* LOLA CHAT */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .message {
    display: flex;
    gap: 1rem;
    animation: fadeUp 0.4s ease forwards;
    opacity: 0;
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .avatar.lola {
    background: var(--lola);
    color: var(--gold-light);
    border: 1px solid rgba(200,169,110,0.3);
  }

  .avatar.user {
    background: rgba(200,169,110,0.15);
    color: var(--gold);
    border: 1px solid rgba(200,169,110,0.2);
  }

  .bubble {
    max-width: 85%;
    padding: 1rem 1.3rem;
    border-radius: 2px;
    font-size: 1.05rem;
    line-height: 1.75;
    font-weight: 300;
  }

  .bubble.lola {
    background: rgba(26, 58, 42, 0.4);
    border: 1px solid rgba(200,169,110,0.1);
    color: #f0ebe0;
    border-radius: 0 8px 8px 8px;
  }

  .bubble.user {
    background: rgba(200,169,110,0.1);
    border: 1px solid rgba(200,169,110,0.2);
    color: var(--gold-light);
    border-radius: 8px 0 8px 8px;
    text-align: right;
  }

  .bubble strong {
    color: var(--gold);
    font-weight: 400;
  }

  .bubble em {
    color: var(--gold-light);
    font-style: italic;
  }

  /* TYPING INDICATOR */
  .typing {
    display: flex;
    gap: 4px;
    padding: 0.8rem 1rem;
    align-items: center;
  }

  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: bounce 1.2s infinite;
    opacity: 0.6;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* INPUT AREA */
  .input-area {
    margin-top: 1.5rem;
    border-top: 1px solid rgba(200,169,110,0.1);
    padding-top: 1.5rem;
  }

  .input-wrap {
    display: flex;
    gap: 0.8rem;
    align-items: flex-end;
  }

  textarea#userInput {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(200,169,110,0.2);
    border-radius: 4px;
    padding: 0.9rem 1.2rem;
    color: #f5f0e8;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 300;
    resize: none;
    outline: none;
    min-height: 52px;
    max-height: 120px;
    transition: border-color 0.3s;
    line-height: 1.5;
  }

  textarea#userInput:focus {
    border-color: rgba(200,169,110,0.5);
  }

  textarea#userInput::placeholder {
    color: rgba(200,169,110,0.3);
    font-style: italic;
  }

  button#sendBtn {
    width: 52px; height: 52px;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    color: var(--ink);
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.3s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  button#sendBtn:hover { background: var(--gold-light); }
  button#sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* QUICK REPLIES */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .quick-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.5rem 1rem;
    background: transparent;
    border: 1px solid rgba(200,169,110,0.25);
    color: var(--gold);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .quick-btn:hover {
    background: rgba(200,169,110,0.1);
    border-color: var(--gold);
  }

  /* LESSON CARD */
  .lesson-card {
    background: rgba(26,58,42,0.2);
    border: 1px solid rgba(200,169,110,0.15);
    border-radius: 4px;
    padding: 1.5rem;
    margin-top: 0.5rem;
  }

  .lesson-card-header {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.8rem;
  }

  .lesson-card h3 {
    font-size: 1.4rem;
    font-weight: 300;
    margin-bottom: 0.5rem;
    color: #f5f0e8;
  }

  .lesson-card p {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.7;
    font-weight: 300;
  }

  .lesson-card .lesson-goal {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    background: rgba(200,169,110,0.05);
    border-left: 2px solid var(--gold);
    font-size: 0.95rem;
    color: var(--gold-light);
    font-style: italic;
  }

  /* EXERCISE */
  .exercise-block {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(200,169,110,0.1);
    border-radius: 4px;
    padding: 1.2rem 1.5rem;
    margin-top: 1rem;
  }

  .exercise-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .exercise-prompt {
    font-size: 1.1rem;
    color: var(--gold-light);
    margin-bottom: 1rem;
    line-height: 1.6;
  }

  .exercise-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(200,169,110,0.15);
    border-radius: 3px;
    padding: 0.8rem 1rem;
    color: #f5f0e8;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s;
  }

  .exercise-input:focus { border-color: var(--gold); }

  /* PROFILE BADGE */
  .profile-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 1rem;
    background: rgba(200,169,110,0.08);
    border: 1px solid rgba(200,169,110,0.2);
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    margin-top: 0.5rem;
  }

  .profile-badge .level {
    padding: 2px 8px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 10px;
    font-weight: 500;
  }

  /* SCORE */
  .score-display {
    text-align: center;
    padding: 2rem;
  }

  .score-number {
    font-size: 5rem;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .score-good { color: var(--success); }
  .score-ok { color: var(--gold); }
  .score-low { color: var(--danger); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(200,169,110,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  /* MOBILE */
  @media (max-width: 600px) {
    main { padding: 1rem; }
    .bubble { max-width: 92%; font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span>O</span>RBIA</a>
  <span class="header-tag">Unique Language Learning Loop</span>
</header>

<main>
  <div class="phase-bar">
    <div class="phase-dot active" id="dot1"></div>
    <div class="phase-dot" id="dot2"></div>
    <div class="phase-dot" id="dot3"></div>
    <div class="phase-dot" id="dot4"></div>
    <span class="phase-label" id="phaseLabel"><span>Analyse</span> · Bedarfsanalyse</span>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="input-area" id="inputArea">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Schreiben Sie hier..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">→</button>
    </div>
    <div class="quick-replies" id="quickReplies"></div>
  </div>
</main>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const CLAUDE_API = '/api/chat';
const MODEL = 'claude-sonnet-4-20250514';

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  phase: 'intake',        // intake → profile → lesson → exercise → eval → next
  profile: null,
  lesson: null,
  exercises: [],
  exerciseAnswers: {},
  currentExercise: 0,
  conversationHistory: [],
  cycleCount: 1,
};

// ─── LOLA SYSTEM PROMPT ───────────────────────────────────────────────────────
const LOLA_SYSTEM = `Du bist Lola, die persönliche Sprachlernberaterin von Orbia.

DEINE PERSÖNLICHKEIT:
- Warm, professionell, direkt — nie aufgesetzt oder woke
- Du duzt nicht, du sizt — Sie
- Spanische Seele, deutsche Präzision
- Kurze, klare Sätze. Keine langen Monologe.
- Du stellst immer nur EINE Frage auf einmal

DEINE AUFGABE — PHASE 1 (INTAKE):
Führe eine natürliche Bedarfsanalyse. Kläre der Reihe nach:
1. Name des Schülers
2. Muttersprache
3. Welche Sprache lernen (Spanisch, Deutsch, Englisch etc.)
4. Aktuelles Niveau (Anfänger, Grundkenntnisse, Mittelstufe, Fortgeschritten)
5. Konkretes Ziel (Urlaub, Business-Meeting, Auswandern, Präsentation etc.)
6. Dringlichkeit / Zeitrahmen

Wenn du alle 6 Punkte hast, sage GENAU:
"INTAKE_COMPLETE: [Name], [Muttersprache], [Zielsprache], [Niveau], [Ziel], [Zeitrahmen]"

WICHTIGE REGELN:
- Metasprachliche Erklärungen immer in der Muttersprache des Schülers (unter B1: IMMER Deutsch wenn Muttersprache Deutsch)
- Sei warmherzig aber effizient — kein Smalltalk ohne Grund
- Wenn jemand schüchtern wirkt, ermutige sanft
- Erste Nachricht: Begrüße herzlich, stelle dich vor, erste Frage`;

const PROFILE_SYSTEM = `Du bist das Analysesystem von Orbia.
Analysiere die Intake-Daten und erstelle ein Lernerprofil als JSON.
Antworte NUR mit validem JSON ohne Backticks:
{
  "name": "Vorname",
  "nativeLanguage": "de",
  "targetLanguage": "es",
  "level": "A1|A2|B1|B2|C1",
  "levelScore": 0-100,
  "goal": "konkretes Ziel",
  "timeframe": "Zeitrahmen",
  "strengths": [],
  "weaknesses": [],
  "nextFocus": "erstes Lernziel",
  "packageName": "Name des Kurspakets z.B. Spanisch für Verhandlungen"
}`;

const LESSON_SYSTEM = `Du bist Lola, Sprachlehrerin bei Orbia. Erstelle eine kurze, intensive personalisierte Lektion.
Metasprachliche Anweisungen IMMER in der Muttersprache des Schülers.
Antworte NUR mit validem JSON ohne Backticks:
{
  "title": "Lektionstitel",
  "goal": "Was der Schüler nach dieser Lektion kann",
  "warmup": "Persönlicher Einstieg von Lola an den Schüler (1-2 Sätze, in Muttersprache)",
  "explanation": "Kerninhalt mit Beispielen (in Muttersprache des Schülers, Zielsprache fett markiert mit **Wort**)",
  "businessExample": "Ein konkretes Beispiel aus dem Ziel-Kontext des Schülers",
  "exercises": [
    {"id":"e1","type":"translate","prompt":"Aufgabe auf Muttersprache","answer":"Musterlösung","hint":"Tipp falls nötig"},
    {"id":"e2","type":"fill","prompt":"Aufgabe","answer":"Lösung","hint":"Tipp"},
    {"id":"e3","type":"free","prompt":"Freie Aufgabe","answer":"Beispielantwort","hint":"Tipp"}
  ],
  "exitQuestion": "Offene Abschlussfrage in Zielsprache"
}`;

const EVAL_SYSTEM = `Du bist das Bewertungssystem von Orbia.
Bewerte die Antworten des Schülers. Antworte NUR mit JSON ohne Backticks:
{
  "results": [
    {"id":"e1","correct":true,"score":0-100,"feedback":"kurzes Feedback in Muttersprache","correction":"korrigierte Version falls falsch"}
  ],
  "overallScore": 0-100,
  "lolaComment": "Lolas persönlicher Kommentar — warm, ehrlich, motivierend (2-3 Sätze in Muttersprache)",
  "newStrengths": [],
  "newWeaknesses": [],
  "nextFocusSuggestion": "Vorschlag für nächste Lektion"
}`;

// ─── CLAUDE API ───────────────────────────────────────────────────────────────
async function callClaude(system, messages, maxTokens = 1000) {
  const res = await fetch(CLAUDE_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages })
  });
  if (!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  return data.content.find(b => b.type === 'text')?.text || '';
}

function parseJSON(raw) {
  try { return JSON.parse(raw.replace(/```json|```/g, '').trim()); }
  catch { return null; }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function addMessage(role, content, delay = 0) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  msg.style.animationDelay = delay + 'ms';

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'lola' ? 'LO' : 'SIE';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const typing = document.createElement('div');
  typing.className = 'message lola';
  typing.id = 'typingIndicator';
  typing.innerHTML = `
    <div class="avatar lola">LO</div>
    <div class="bubble lola typing">
      <span></span><span></span><span></span>
    </div>`;
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function setQuickReplies(options) {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('userInput').value = opt;
      sendMessage();
    };
    qr.appendChild(btn);
  });
}

function setPhase(name, label) {
  const phases = ['intake', 'profile', 'lesson', 'eval'];
  const idx = phases.indexOf(name);
  phases.forEach((p, i) => {
    const dot = document.getElementById('dot' + (i+1));
    if (i < idx) dot.className = 'phase-dot done';
    else if (i === idx) dot.className = 'phase-dot active';
    else dot.className = 'phase-dot';
  });
  document.getElementById('phaseLabel').innerHTML = `<span>${label}</span>`;
}

// ─── INTAKE FLOW ──────────────────────────────────────────────────────────────
async function startConversation() {
  showTyping();
  try {
    const response = await callClaude(LOLA_SYSTEM, [
      { role: 'user', content: 'Starte die Begrüßung.' }
    ], 300);
    removeTyping();
    addMessage('lola', response);
    state.conversationHistory.push({ role: 'assistant', content: response });
    setQuickReplies(['Spanisch lernen', 'Deutsch lernen', 'Englisch lernen']);
  } catch(e) {
    removeTyping();
    addMessage('lola', 'Entschuldigung, es gab einen technischen Fehler. Bitte laden Sie die Seite neu.');
  }
}

async function continueIntake(userMessage) {
  state.conversationHistory.push({ role: 'user', content: userMessage });
  showTyping();

  try {
    const response = await callClaude(LOLA_SYSTEM, state.conversationHistory, 400);
    removeTyping();

    if (response.includes('INTAKE_COMPLETE:')) {
      // Parse intake data
      const data = response.split('INTAKE_COMPLETE:')[1].trim().split(',').map(s => s.trim());
      addMessage('lola', `Ausgezeichnet! Ich habe alle Informationen. Einen Moment — ich erstelle Ihr persönliches Lernprofil...`);
      await buildProfile(data);
    } else {
      addMessage('lola', response);
      state.conversationHistory.push({ role: 'assistant', content: response });

      // Smart quick replies based on conversation stage
      const lower = response.toLowerCase();
      if (lower.includes('niveau') || lower.includes('kenntnisse')) {
        setQuickReplies(['Kompletter Anfänger', 'Grundkenntnisse', 'Mittelstufe', 'Fortgeschritten']);
      } else if (lower.includes('ziel') || lower.includes('wozu')) {
        setQuickReplies(['Urlaub & Reisen', 'Business-Meetings', 'Auswandern', 'Präsentationen halten']);
      } else if (lower.includes('wann') || lower.includes('zeitrahmen') || lower.includes('dringend')) {
        setQuickReplies(['In 1 Monat', 'In 3 Monaten', 'In 6 Monaten', 'Kein Zeitdruck']);
      } else {
        setQuickReplies([]);
      }
    }
  } catch(e) {
    removeTyping();
    addMessage('lola', 'Entschuldigung, ein kurzer technischer Unterbruch. Bitte versuchen Sie es nochmal.');
  }
}

// ─── PROFILE BUILD ────────────────────────────────────────────────────────────
async function buildProfile(intakeData) {
  setPhase('profile', 'Profil wird erstellt');

  try {
    const raw = await callClaude(PROFILE_SYSTEM, [{
      role: 'user',
      content: `Intake-Daten: Name=${intakeData[0]}, Muttersprache=${intakeData[1]}, Zielsprache=${intakeData[2]}, Niveau=${intakeData[3]}, Ziel=${intakeData[4]}, Zeitrahmen=${intakeData[5]}`
    }], 600);

    state.profile = parseJSON(raw);
    if (!state.profile) {
      state.profile = {
        name: intakeData[0] || 'Schüler',
        nativeLanguage: 'de',
        targetLanguage: intakeData[2] || 'Spanisch',
        level: 'A1', levelScore: 20,
        goal: intakeData[4] || 'Konversation',
        timeframe: intakeData[5] || '3 Monate',
        strengths: [], weaknesses: [],
        nextFocus: 'Grundvokabular und Begrüßungen',
        packageName: 'Spanisch für Einsteiger'
      };
    }

    // Show profile
    const profileHTML = `
      <div class="profile-badge">
        <span class="level">${state.profile.level}</span>
        <span>${state.profile.name}</span>
        <span>·</span>
        <span>${state.profile.packageName}</span>
      </div>`;

    addMessage('lola', `Ihr Profil ist fertig, ${state.profile.name}! ${profileHTML}<br><br>Paket: <strong>${state.profile.packageName}</strong><br>Ziel: ${state.profile.goal}<br>Zeitrahmen: ${state.profile.timeframe}<br><br>Bereit für Ihre erste Lektion?`);
    setQuickReplies(['Ja, los geht\'s!', 'Noch eine Frage zuerst']);

    state.phase = 'ready';
    setPhase('lesson', 'Erste Lektion');

  } catch(e) {
    addMessage('lola', 'Profil konnte nicht erstellt werden. Bitte versuchen Sie es nochmal.');
  }
}

// ─── LESSON GENERATION ───────────────────────────────────────────────────────
async function generateLesson() {
  setPhase('lesson', 'Lektion wird generiert');
  addMessage('lola', 'Einen Moment — ich bereite Ihre persönliche Lektion vor...');
  showTyping();

  try {
    const raw = await callClaude(LESSON_SYSTEM, [{
      role: 'user',
      content: `Schülerprofil: ${JSON.stringify(state.profile)}\nZyklus: ${state.cycleCount}`
    }], 1200);

    removeTyping();
    state.lesson = parseJSON(raw);

    if (!state.lesson) {
      addMessage('lola', 'Entschuldigung, die Lektion konnte nicht geladen werden. Bitte versuchen Sie es nochmal.');
      return;
    }

    // Show lesson
    const lessonHTML = `
      <div class="lesson-card">
        <div class="lesson-card-header">Lektion ${state.cycleCount} · ${state.profile.level}</div>
        <h3>${state.lesson.title}</h3>
        <div class="lesson-goal">${state.lesson.goal}</div>
      </div>`;

    addMessage('lola', state.lesson.warmup + lessonHTML, 0);

    setTimeout(() => {
      addMessage('lola', state.lesson.explanation, 200);
    }, 600);

    setTimeout(() => {
      addMessage('lola', `<strong>Beispiel aus Ihrem Kontext:</strong><br>${state.lesson.businessExample}`, 400);
    }, 1200);

    setTimeout(() => {
      addMessage('lola', 'Gut. Jetzt üben wir. Ich stelle Ihnen 3 kurze Aufgaben. Nehmen Sie sich Zeit.', 600);
      state.phase = 'exercise';
      state.currentExercise = 0;
      setQuickReplies([]);
      setTimeout(() => showExercise(0), 800);
    }, 2000);

  } catch(e) {
    removeTyping();
    addMessage('lola', 'Technischer Fehler bei der Lektionsgenerierung. Bitte versuchen Sie es nochmal.');
  }
}

// ─── EXERCISES ────────────────────────────────────────────────────────────────
function showExercise(idx) {
  if (!state.lesson || !state.lesson.exercises[idx]) return;
  const ex = state.lesson.exercises[idx];

  const typeLabel = ex.type === 'translate' ? 'Übersetzen' : ex.type === 'fill' ? 'Ergänzen' : 'Freie Antwort';

  const exHTML = `
    <div class="exercise-block" id="ex_${ex.id}">
      <div class="exercise-num">Aufgabe ${idx+1}/3 · ${typeLabel}</div>
      <div class="exercise-prompt">${ex.prompt}</div>
      ${ex.hint ? `<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.8rem;font-style:italic;">💡 ${ex.hint}</div>` : ''}
    </div>`;

  addMessage('lola', exHTML);
  setPhase('lesson', `Aufgabe ${idx+1} von 3`);

  // Set input placeholder
  document.getElementById('userInput').placeholder = 'Ihre Antwort auf Spanisch...';
  document.getElementById('userInput').focus();
}

// ─── EVALUATION ──────────────────────────────────────────────────────────────
async function evaluateLesson() {
  setPhase('eval', 'Auswertung');
  showTyping();

  try {
    const raw = await callClaude(EVAL_SYSTEM, [{
      role: 'user',
      content: `Profil: ${JSON.stringify(state.profile)}\nLektion: ${JSON.stringify(state.lesson)}\nAntworten: ${JSON.stringify(state.exerciseAnswers)}`
    }], 800);

    removeTyping();
    const eval_ = parseJSON(raw);

    if (!eval_) {
      addMessage('lola', 'Auswertung konnte nicht geladen werden.');
      return;
    }

    // Score display
    const score = eval_.overallScore;
    const scoreClass = score >= 80 ? 'score-good' : score >= 50 ? 'score-ok' : 'score-low';
    const scoreMsg = score >= 80 ? 'Excelente' : score >= 50 ? 'Bien' : 'Seguimos';

    let resultsHTML = `<div class="score-display"><div class="score-number ${scoreClass}">${score}</div><div style="font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:0.2em;color:var(--muted)">${scoreMsg}</div></div>`;

    eval_.results?.forEach((r, i) => {
      const icon = r.correct ? '✓' : '✗';
      const color = r.correct ? 'var(--success)' : 'var(--danger)';
      resultsHTML += `<div style="padding:0.8rem 1rem;margin-bottom:0.5rem;border-left:2px solid ${color};background:rgba(255,255,255,0.02)">
        <span style="color:${color};font-family:'DM Mono',monospace;font-size:0.75rem">${icon} Aufgabe ${i+1}</span><br>
        <span style="font-size:0.95rem;color:var(--muted)">${r.feedback}</span>
        ${r.correction ? `<br><span style="color:var(--gold-light);font-style:italic">${r.correction}</span>` : ''}
      </div>`;
    });

    addMessage('lola', resultsHTML);

    setTimeout(() => {
      addMessage('lola', eval_.lolaComment);
      // Update profile
      state.profile.strengths = [...(state.profile.strengths || []), ...(eval_.newStrengths || [])];
      state.profile.weaknesses = [...(state.profile.weaknesses || []), ...(eval_.newWeaknesses || [])];
      state.profile.levelScore = Math.min(100, (state.profile.levelScore || 0) + (score > 70 ? 5 : -2));
      if (eval_.nextFocusSuggestion) state.profile.nextFocus = eval_.nextFocusSuggestion;
      state.cycleCount++;
      state.phase = 'done';

      setTimeout(() => {
        addMessage('lola', `Möchten Sie direkt mit Zyklus ${state.cycleCount} weitermachen?`);
        setQuickReplies(['Ja, weiter!', 'Pause machen', 'Frage zu dieser Lektion']);
      }, 800);
    }, 600);

  } catch(e) {
    removeTyping();
    addMessage('lola', 'Auswertungsfehler. Bitte versuchen Sie es nochmal.');
  }
}

// ─── MESSAGE HANDLER ─────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';

  addMessage('user', text);

  // Route based on phase
  if (state.phase === 'intake') {
    await continueIntake(text);
  } else if (state.phase === 'ready') {
    if (text.toLowerCase().includes('ja') || text.toLowerCase().includes('los') || text.toLowerCase().includes('weiter')) {
      await generateLesson();
    } else {
      state.conversationHistory.push({ role: 'user', content: text });
      showTyping();
      const response = await callClaude(LOLA_SYSTEM, state.conversationHistory, 300);
      removeTyping();
      addMessage('lola', response);
      state.conversationHistory.push({ role: 'assistant', content: response });
      setQuickReplies(['Ja, los geht\'s!']);
    }
  } else if (state.phase === 'exercise') {
    // Store answer
    const ex = state.lesson.exercises[state.currentExercise];
    state.exerciseAnswers[ex.id] = { prompt: ex.prompt, expected: ex.answer, given: text };

    // Quick feedback
    const isClose = text.toLowerCase().includes(ex.answer.toLowerCase().substring(0, 4));
    addMessage('lola', isClose ? '👍 Weiter so.' : 'Notiert. Nächste Aufgabe.');

    state.currentExercise++;
    if (state.currentExercise < state.lesson.exercises.length) {
      setTimeout(() => showExercise(state.currentExercise), 600);
    } else {
      // Exit question
      setTimeout(() => {
        addMessage('lola', `Letzte Aufgabe — frei antworten:<br><br><em>${state.lesson.exitQuestion}</em>`);
        state.phase = 'exit';
        document.getElementById('userInput').placeholder = 'Antworten Sie frei auf Spanisch...';
      }, 600);
    }
  } else if (state.phase === 'exit') {
    state.exerciseAnswers['exit'] = { prompt: state.lesson.exitQuestion, given: text };
    addMessage('lola', 'Gut. Ich werte jetzt alles aus...');
    state.phase = 'evaluating';
    await evaluateLesson();
  } else if (state.phase === 'done') {
    if (text.toLowerCase().includes('ja') || text.toLowerCase().includes('weiter')) {
      state.phase = 'ready';
      state.lesson = null;
      state.exerciseAnswers = {};
      state.currentExercise = 0;
      await generateLesson();
    } else if (text.toLowerCase().includes('pause')) {
      addMessage('lola', `Sehr gut, ${state.profile.name}. Bis zum nächsten Mal — und denken Sie daran: kleine, regelmäßige Einheiten sind der Schlüssel. A pronto! 👋`);
      setQuickReplies(['Neue Sitzung starten']);
    } else {
      // Free conversation with Lola
      showTyping();
      const response = await callClaude(LOLA_SYSTEM, [
        ...state.conversationHistory,
        { role: 'user', content: text }
      ], 300);
      removeTyping();
      addMessage('lola', response);
      setQuickReplies(['Weiter lernen', 'Pause machen']);
    }
  }

  btn.disabled = false;
  input.focus();
}

// ─── AUTO RESIZE TEXTAREA ────────────────────────────────────────────────────
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ─── START ────────────────────────────────────────────────────────────────────
startConversation();
</script>
