<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbia — Lola</title>
</head>
<body style="background:#0e0e0e;color:#f5f0e8;font-family:sans-serif;padding:2rem;max-width:600px;margin:0 auto">
<h2 style="color:#c8a96e">Orbia · Lola</h2>
<div id="chat" style="min-height:200px;margin:1rem 0"></div>
<input id="msg" type="text" placeholder="Schreiben Sie hier..." 
  style="width:100%;padding:0.8rem;background:#1a1a1a;border:1px solid #333;color:#fff;font-size:1rem">
<button onclick="send()" style="margin-top:0.5rem;padding:0.8rem 2rem;background:#c8a96e;border:none;cursor:pointer;font-size:1rem">Senden</button>

<script>
const KEY = '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';
const history = [];

async function send() {
  const msg = document.getElementById('msg').value.trim();
  if (!msg) return;
  addMsg('Sie', msg);
  document.getElementById('msg').value = '';
  history.push({role:'user', content: msg});
  
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': KEY,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 500,
      system: 'Du bist Lola, freundliche Sprachlernberaterin von Orbia. Antworte auf Deutsch, kurz und warm.',
      messages: history
    })
  });
  
  const d = await r.json();
  const reply = d.content[0].text;
  history.push({role:'assistant', content: reply});
  addMsg('Lola', reply);
}

function addMsg(who, text) {
  const chat = document.getElementById('chat');
  chat.innerHTML += `<p><strong style="color:#c8a96e">${who}:</strong> ${text}</p>`;
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

addMsg('Lola', 'Hola! Ich bin Lola, Ihre persönliche Sprachlernberaterin. Wie kann ich Ihnen helfen?');
</script>
</body>
</html>
